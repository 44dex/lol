        <style>
            * {
                box-sizing: border-box;
            }

            #games {
                grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
                max-width: 1250px;
                min-height: 100vh;
                margin: 0 auto;
                padding: 35px 28px 70px;
                display: grid;
                gap: 18px;
                align-content: start;
            }

            body {
                background: #0c101b;
                color: #ffffff;
                font-family: Inter, "Segoe UI", Arial, sans-serif;
            }

            button {
                position: relative;
                min-height: 155px;
                width: 100%;
                padding: 22px;
                border: 1px solid rgba(255,255,255,0.12);
                border-radius: 17px;
                color: white;
                font-size: 19px;
                font-weight: 750;
                font-family: inherit;
                text-align: left;
                cursor: pointer;
                overflow: hidden;
                background: linear-gradient(135deg, #263c70, #172442);
                box-shadow: 0 5px 18px rgba(0,0,0,0.25);
                transition:
                    transform 0.2s ease,
                    box-shadow 0.2s ease,
                    border-color 0.2s ease;
            }

            button:hover {
                transform: translateY(-6px) scale(1.015);
                border-color: rgba(255,255,255,0.5);
                box-shadow: 0 12px 30px rgba(0,0,0,0.4);
            }

            button:active {
                transform: scale(0.97);
            }

            button::before {
                position: absolute;
                top: 16px;
                right: 19px;
                font-size: 43px;
                opacity: 0.9;
                transition: transform 0.25s ease;
            }

            button:hover::before {
                transform: scale(1.2) rotate(-8deg);
            }

            button::after {
                content: "▶  SPELA NU";
                display: block;
                font-size: 10px;
                letter-spacing: 1.5px;
                font-weight: 800;
                color: rgba(255,255,255,0.65);
                margin-top: 12px;
            }

            iframe {
                display: block;
                grid-column: 1 / -1;
                justify-self: center;
                width: 70%;
                max-width: 1100px;
                height: auto;
                border: 1px solid #35415b;
                border-radius: 16px;
                background: #111827;
                box-shadow: 0 15px 50px rgba(0,0,0,0.5);
                margin: 8px 0 25px;
            }
        </style>

                const button = document.createElement("button");
            
                button.className = "game-card";
                button.id = "game-" + (index + 1);
                button.textContent = name;
                button.dataset.loaded = "false";
            
                button.addEventListener("click", () => {
                    const currentIframe = document.querySelector(".game-frame");
            
                    if (currentIframe) {
                        const currentButton = document.querySelector(
                            `#game-${currentIframe.dataset.gameIndex}`
                        );
            
                        currentIframe.remove();
            
                        if (currentButton) {
                            currentButton.dataset.loaded = "false";
                        }
            
                        if (currentIframe.dataset.gameIndex == index + 1) {
                            return;
                        }
                    }
            
                    const iframe = document.createElement("iframe");
            
                    iframe.className = "game-frame";
                    iframe.id = "game-frame-" + (index + 1);
                    iframe.dataset.gameIndex = index + 1;
            
                    iframe.src = links[index];
                    iframe.allowFullscreen = true;
                    iframe.style.border = "none";

                        ? "1 / 1"
                        : "16 / 9";
            
                    button.insertAdjacentElement("afterend", iframe);
                    button.dataset.loaded = "true";
